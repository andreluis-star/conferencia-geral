<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Conferência Geral — Login</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #0d2137;
    --blue: #1a3a5c;
    --amber: #f0a500;
    --amber-dark: #c88600;
    --white: #fff;
    --gray: #f4f6fa;
    --text: #222;
    --muted: #888;
    --danger: #dc3545;
    --success: #28a745;
    --radius: 10px;
  }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, var(--navy) 0%, var(--blue) 60%, #2a5298 100%);
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  .card {
    background: var(--white);
    border-radius: 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    padding: 40px 36px 32px;
    width: 100%;
    max-width: 420px;
    margin: 20px;
  }
  .logo-area {
    text-align: center;
    margin-bottom: 32px;
  }
  .logo-icon {
    width: 110px; height: 110px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 14px;
  }
  .logo-icon img { width: 110px; height: 110px; object-fit: contain; }
  h1 { font-size: 1.5rem; color: var(--navy); font-weight: 700; margin-bottom: 4px; }
  .subtitle { color: var(--muted); font-size: 0.9rem; }
  .form-group { margin-bottom: 18px; }
  label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--blue); margin-bottom: 6px; }
  input[type=email], input[type=password], input[type=text] {
    width: 100%; padding: 13px 14px; border: 2px solid #dde3f0; border-radius: var(--radius);
    font-size: 1rem; color: var(--text); background: var(--gray);
    transition: border-color 0.2s;
    outline: none;
  }
  input:focus { border-color: var(--blue); background: #fff; }
  .btn-primary {
    width: 100%; padding: 14px; background: var(--navy); color: var(--white);
    border: none; border-radius: var(--radius); font-size: 1rem; font-weight: 700;
    cursor: pointer; transition: background 0.2s, transform 0.1s;
    margin-top: 4px;
  }
  .btn-primary:hover { background: var(--blue); }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
  .error-msg {
    background: #fff0f0; border: 1px solid #f5c6cb; color: var(--danger);
    padding: 10px 14px; border-radius: 8px; font-size: 0.875rem; margin-top: 14px;
    display: none;
  }
  .error-msg.show { display: block; }
  .divider { display: flex; align-items: center; gap: 10px; margin: 24px 0 20px; }
  .divider::before, .divider::after { content:''; flex:1; height:1px; background:#e0e6f0; }
  .divider span { font-size: 0.78rem; color: var(--muted); white-space: nowrap; }
  .setup-section { background: #f8f4e8; border: 1px solid #e8d8a0; border-radius: var(--radius); padding: 18px; }
  .setup-section h3 { font-size: 0.95rem; color: #7a5500; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
  .setup-section .form-group { margin-bottom: 12px; }
  .setup-section input { background: #fff; }
  .btn-amber {
    width: 100%; padding: 12px; background: var(--amber); color: var(--navy);
    border: none; border-radius: var(--radius); font-size: 0.95rem; font-weight: 700;
    cursor: pointer; transition: background 0.2s;
  }
  .btn-amber:hover { background: var(--amber-dark); color: #fff; }
  .spinner {
    display: inline-block; width: 18px; height: 18px;
    border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff;
    border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* ── SELETOR DE USUÁRIO ── */
  .user-picker-label { font-size: 0.85rem; font-weight: 600; color: var(--blue); margin-bottom: 6px; display: block; }
  #user-list {
    display: flex; flex-direction: column; gap: 6px;
    max-height: 200px; overflow-y: auto; margin-bottom: 4px;
    border: 2px solid #dde3f0; border-radius: var(--radius);
    background: var(--gray); padding: 6px;
  }
  .user-btn {
    display: flex; align-items: center; gap: 10px;
    background: #fff; border: 2px solid transparent;
    border-radius: 8px; padding: 9px 12px; cursor: pointer;
    text-align: left; transition: border-color 0.15s, background 0.15s;
    width: 100%;
  }
  .user-btn:hover   { border-color: var(--blue); background: #f0f4ff; }
  .user-btn.active  { border-color: var(--navy); background: #e8f0ff; }
  .user-avatar {
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--navy); color: var(--amber);
    font-weight: 800; font-size: 0.9rem;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .user-name  { font-size: 0.88rem; font-weight: 700; color: var(--navy); }
  .user-email { font-size: 0.75rem; color: var(--muted); }
  .user-picker-loading { text-align:center; color: var(--muted); font-size:0.82rem; padding:8px; }

  /* ── LEMBRAR SENHA ── */
  .remember-row {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 18px; margin-top: -6px;
  }
  .remember-row input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--navy); flex-shrink: 0; }
  .remember-row label { font-size: 0.83rem; color: var(--muted); cursor: pointer; font-weight: 500; margin: 0; }
</style>
</head>
<body>
<div class="card">
  <div class="logo-area">
    <div class="logo-icon">
      <img src="logo%20portoex.png" alt="Portoex"/>
    </div>
    <h1>Conferência Geral</h1>
    <p class="subtitle">Gestão de operações logísticas</p>
  </div>

  <!-- Seletor de conferente -->
  <div class="form-group" id="user-picker-group">
    <span class="user-picker-label">👤 Selecione o conferente</span>
    <div id="user-list">
      <div class="user-picker-loading">Carregando conferentes…</div>
    </div>
  </div>

  <form id="login-form">
    <div class="form-group">
      <label for="email">E-mail</label>
      <input type="email" id="email" placeholder="seu@email.com" required autocomplete="username"/>
    </div>
    <div class="form-group">
      <label for="senha">Senha</label>
      <input type="password" id="senha" placeholder="••••••••" required autocomplete="current-password"/>
    </div>
    <div class="remember-row">
      <input type="checkbox" id="chk-lembrar"/>
      <label for="chk-lembrar">Lembrar login e senha neste aparelho</label>
    </div>
    <button type="submit" class="btn-primary" id="btn-login">Entrar</button>
    <div class="error-msg" id="login-error"></div>
  </form>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<!-- Storage não utilizado neste plano -->
<script src="firebase-config.js"></script>
<script>
const STORAGE_KEY = 'conf_saved_logins'; // { email: { nome, senha } }

// ── Carrega credencial salva ao iniciar ──
function loadSavedLogin(email) {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    if (saved[email]) {
      document.getElementById('senha').value = atob(saved[email].senha || '');
      document.getElementById('chk-lembrar').checked = true;
    }
  } catch(e) {}
}

function saveLogin(email, senha) {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    saved[email] = { senha: btoa(senha) };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
  } catch(e) {}
}

function clearLogin(email) {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    delete saved[email];
    localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
  } catch(e) {}
}

// ── Seleciona usuário da lista ──
function selectUser(email, nome) {
  document.querySelectorAll('.user-btn').forEach(b => b.classList.remove('active'));
  const btn = document.querySelector(`.user-btn[data-email="${CSS.escape(email)}"]`);
  if (btn) btn.classList.add('active');
  document.getElementById('email').value = email;
  loadSavedLogin(email);
  document.getElementById('senha').focus();
}

// ── Carrega lista de conferentes do Firestore ──
async function loadUserList() {
  const container = document.getElementById('user-list');
  try {
    const snap = await db.collection('users').where('ativo', '==', true).orderBy('nome').get();
    if (snap.empty) {
      container.innerHTML = '<div class="user-picker-loading">Nenhum conferente cadastrado.</div>';
      return;
    }
    container.innerHTML = '';
    snap.docs.forEach(doc => {
      const u = doc.data();
      const iniciais = (u.nome || u.email || '?').split(' ').slice(0,2).map(p=>p[0]).join('').toUpperCase();
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'user-btn';
      btn.dataset.email = u.email;
      btn.innerHTML = `
        <div class="user-avatar">${iniciais}</div>
        <div>
          <div class="user-name">${u.nome || '—'}</div>
          <div class="user-email">${u.email}</div>
        </div>`;
      btn.addEventListener('click', () => selectUser(u.email, u.nome));
      container.appendChild(btn);
    });

    // Auto-seleciona se só tiver um ou se tiver login salvo
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    const savedEmail = Object.keys(saved)[0];
    if (savedEmail) {
      const match = snap.docs.find(d => d.data().email === savedEmail);
      if (match) selectUser(match.data().email, match.data().nome);
    } else if (snap.docs.length === 1) {
      const u = snap.docs[0].data();
      selectUser(u.email, u.nome);
    }
  } catch(e) {
    container.innerHTML = '<div class="user-picker-loading">Digite seu e-mail abaixo.</div>';
    document.getElementById('user-picker-group').style.display = 'none';
  }
}

// ── DIAGNÓSTICO (abra o login com  index.html#diag  para ativar) ──
const MODO_DIAG = (location.hash || '').toLowerCase().includes('diag');

async function mostrarDiag() {
  const user = auth.currentUser;
  let html = '';
  if (!user) {
    html = '<b>Ainda não logado.</b> Faça login normalmente nesta tela (com #diag na URL) que o diagnóstico aparece após entrar.';
  } else {
    let existe = '?', role = '?', erro = '';
    try {
      const doc = await db.collection('users').doc(user.uid).get();
      existe = doc.exists ? 'SIM' : 'NÃO';
      role   = doc.exists ? (doc.data().role || '(sem campo role)') : '—';
    } catch (e) {
      erro = e.code + ' — ' + e.message;
    }
    const destino = role === 'admin' ? 'admin.html' : role === 'conferente' ? 'conferente.html' : '(nenhum / volta pro login)';
    html = `
      <div><b>UID do login:</b> <code>${user.uid}</code></div>
      <div><b>E-mail:</b> ${user.email}</div>
      <div><b>Documento users/{uid} encontrado?</b> <b style="color:${existe==='SIM'?'#0f0':'#f66'}">${existe}</b></div>
      <div><b>role lido:</b> <b style="color:${role==='admin'?'#0f0':'#ffd24d'}">${role}</b></div>
      ${erro ? `<div style="color:#f66"><b>ERRO de leitura:</b> ${erro}</div>` : ''}
      <div><b>Deveria ir para:</b> ${destino}</div>
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">
        <button id="diag-admin" style="padding:6px 12px;border:0;border-radius:6px;background:#f0a500;color:#12233b;font-weight:700;cursor:pointer;">Forçar admin.html</button>
        <button id="diag-fechar" style="padding:6px 12px;border:1px solid #567;border-radius:6px;background:transparent;color:#cde;cursor:pointer;">Fechar</button>
      </div>`;
  }
  let box = document.getElementById('diag-box');
  if (!box) {
    box = document.createElement('div');
    box.id = 'diag-box';
    box.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#0c1b2e;color:#e8f0fa;font:13px/1.6 system-ui,Arial;padding:14px 18px;box-shadow:0 4px 16px rgba(0,0,0,.4);border-bottom:2px solid #f0a500;';
    document.body.appendChild(box);
  }
  box.innerHTML = '<div style="font-weight:800;color:#f0a500;margin-bottom:6px;">🔎 Diagnóstico de acesso</div>' + html;
  const a = document.getElementById('diag-admin'); if (a) a.onclick = ()=>window.location.href='admin.html';
  const f = document.getElementById('diag-fechar'); if (f) f.onclick = ()=>box.remove();
}

// ── Verifica se já está logado ──
auth.onAuthStateChanged(async user => {
  if (user) {
    if (MODO_DIAG) { mostrarDiag(); return; }
    const data = await getCurrentUserData();
    if (data) { redirectByRole(data); return; }
  }
  loadUserList();
});

// ── Login ──
document.getElementById('login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn   = document.getElementById('btn-login');
  const errEl = document.getElementById('login-error');
  errEl.classList.remove('show');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Entrando…';
  const email  = document.getElementById('email').value.trim();
  const senha  = document.getElementById('senha').value;
  const lembrar = document.getElementById('chk-lembrar').checked;
  try {
    await auth.signInWithEmailAndPassword(email, senha);
    if (lembrar) { saveLogin(email, senha); }
    else         { clearLogin(email); }
    if (MODO_DIAG) { btn.disabled = false; btn.innerHTML = 'Entrar'; mostrarDiag(); return; }
    const data = await getCurrentUserData();
    redirectByRole(data);
  } catch (err) {
    let msg = 'E-mail ou senha incorretos.';
    if (err.code === 'auth/too-many-requests') msg = 'Muitas tentativas. Aguarde alguns minutos.';
    if (err.code === 'auth/user-disabled')     msg = 'Esta conta foi desativada.';
    errEl.textContent = msg;
    errEl.classList.add('show');
    btn.disabled = false;
    btn.innerHTML = 'Entrar';
  }
});
</script>
</body>
</html>
